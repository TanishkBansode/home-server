<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - CloudDrive</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="/static/styles.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">
    <div class="container">
        <div class="auth-container">
            <div class="auth-header">
                <i class="fas fa-user-plus"></i>
                <h1 style="font-size: 1.75rem; margin-bottom: 0.5rem;">Create Account</h1>
                <p style="color: var(--text-muted);">Join CloudDrive today</p>
            </div>

            {{if .Error}}
            <div
                style="background: rgba(218, 54, 51, 0.1); color: var(--danger); padding: 0.75rem; border-radius: var(--radius-sm); margin-bottom: 1.5rem; border: 1px solid var(--danger);">
                <i class="fas fa-exclamation-circle"></i> {{.Error}}
            </div>
            {{end}}

            <form action="/signup" method="POST">
                <div class="form-group" style="text-align: left;">
                    <label class="form-label" for="username">Username</label>
                    <input type="text" id="username" name="username" class="form-control" required>
                    <small style="color: var(--text-muted); font-size: 0.75rem;">Minimum 2 characters</small>
                </div>

                <div class="form-group" style="text-align: left;">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control" required>
                    <small style="color: var(--text-muted); font-size: 0.75rem;">Minimum 8 characters</small>
                </div>

                <div class="form-group" style="text-align: left;">
                    <label class="form-label" for="confirm_password">Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" class="form-control" required>
                </div>

                <div class="form-group" style="margin-top: 2rem;">
                    <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem;">
                        Create Account <i class="fas fa-check"></i>
                    </button>
                </div>
            </form>

            <div style="margin-top: 2rem; border-top: 1px solid var(--border); padding-top: 1.5rem;">
                <p style="color: var(--text-muted); font-size: 0.9rem;">
                    Already have an account? <a href="/login">Sign in</a>
                </p>
            </div>
        </div>
    </div>
</body>

</html>
